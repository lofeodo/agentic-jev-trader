  PROTOTYPE, throwaway. Never merged into main.
  Question: what does the web app look like, so that it has the look of a 1980s trading terminal and
  is still easy to read? (wayfinder ticket "Web app look: a faithful 1980s Bloomberg terminal that is easy to read")
  Round 5: the developer picked Plasma and kept Wireframe. Plasma is the base, and each way Wireframe differs
  from it is its own on/off switch, in the bar's second row and in the address:
  ?look=plasma&mix=ruler,heads,boxes,pairs,top,title,type,left,two,glow,grid,hatch (any of them), plus
  &face=arimo|inter, &caps=0|1, &tube=orange|amber|green|white, &line=smooth|line|step. The switches are in round5.css.
  Round 4's five looks (?look=plasma | desk | page | work | wire, in round4.css) stay as the record of that round.
  Rounds 1 to 3 (the screens, the side panel, four period looks) are earlier commits on this branch.
  All data is made up. No framework, no build step: open this file in a browser.
-->
