# Trading costs: what buying, selling and holding cost a sim in simulated money (spec appendix 1,
# section 4). Separate from what Jev and LLM calls cost in real money. Every number is a setting a
# tuning sim may change; each sim stores the numbers it ran with. Rates are shares: 0.0005 is 0.05%.

# Slippage: every order is carried out at a price this much worse. A buy at a $100 open pays
# $100.05 a unit; a sell gets $99.95. One number for stocks and crypto (Zipline's default).
slippage = 0.0005

# Commission: a flat dollar amount per stock order, on top of its amount. $2,000 of stock takes
# $2,001; a $2,000 sale puts $1,999 in the account (Interactive Brokers' $1 minimum).
stock_commission = 1.0

# Trading fee: a share of each crypto order's value, on top of its amount. 0.1% of $2,000 is $2
# (Binance's standard rate).
crypto_trading_fee = 0.001

# Borrow fee: what a short still open at midnight UTC pays for the units it borrowed, one day's
# share (1/365) of this yearly rate on its value. A $2,000 stock short pays about 1.4 cents a night,
# a $2,000 crypto short about 27 cents. A short opened and closed within the day pays nothing.
stock_borrow_fee_yearly = 0.0025
crypto_borrow_fee_yearly = 0.05

# Loan interest: what money the account owes at midnight UTC pays, one day's share (1/365) of this
# yearly rate. Owing $10,000 costs about $1.37 a day. A loan paid back within the day costs nothing.
loan_interest_yearly = 0.05
