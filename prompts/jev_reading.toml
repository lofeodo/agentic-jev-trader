screen_question = 'Would a selective day trader act on {asset} now, long or short? Only a decisive move on volume well above normal, or a clean trend turning back after a shallow pullback, counts. Drifting mid-range, choppy small bars and average volume do not. Most assets at most steps do not qualify.'

