# Alembic: makes and changes the Postgres tables (spec appendix 11, section 1), one numbered
# file per change in infra/alembic/versions/, applied once each, in order, as the setup login.
# Where it connects comes from .env (infra/alembic/env.py); which database from
# `-x database=TRADING_AGENT_TEST` (the real one, TRADING_AGENT, when not given).

[alembic]
script_location = %(here)s/infra/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
