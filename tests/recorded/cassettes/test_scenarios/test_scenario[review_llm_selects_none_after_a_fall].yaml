      The position: ASSET_01 (crypto)\nLong, $2,000, opened 5 bars ago at an entry
      price of $101.74.\nStop price: $97.12, fixed. Code sells there. It is 3.5% below
      the last price.\nNow: the position is worth $1,978. Closing it now would leave
      -$27 (-1.3%) after trading costs. At best it was -$1, at worst -$27.\nSituation
