    body: '{"state":"# The task\nThis is a trading account in a replay of market history.
      It trades stocks and crypto in 15-minute steps. At every step each asset is
      looked at once and a decision is made about it.\nThe goal is the highest account
      value at the end of the run. Nothing else is measured.\n\n# How trading works
      here\n- A long gains when the price rises. A short gains when the price falls.\n-
      An order decided at this step is carried out at the opening price of the asset''s
      next bar.\n- Every position has a stop price, fixed when it is opened. Code
      closes the position if the price reaches it. A stock can open the next morning
      beyond its stop price, and then it loses more than planned.\n- An open position
      is not reconsidered at every step. At each step a quick question asks whether
      it is worth a review. A review decides whether to hold it, close it, reduce
      it, or add to it. Between reviews it is held, and only code can close it. A
      stock position is always reviewed at the last step of its session from which
      an order is still carried out the same day: after that step it is held overnight.\n-
      Trading costs: each stock order costs $1; each crypto order costs 0.1% of its
      value; every order is carried out at a price 0.05% worse. A short held at the
      end of a day pays a borrow fee (0.25% a year on a stock, 5% a year on crypto).
      A loan pays interest of 5% a year on what is owed at the end of a day.\n- Code
      enforces the risk limits, whatever is decided: no position may lose more than
      1% of account value at its stop price; no single position may be larger than
      2 times account value, and all positions together at most 2 times; after a loss
      of 5% in one day no position is opened or added to until the next day; and if
      account value falls below 25% of what the account holds, code closes every position
      (a forced close).\n- A decision does not need to hold back in order to stay
      inside a limit. Code does that.\n\n# The account now\nAccount value: $8,823.\nCash:
      -$28,038. Loan: $28,038.\nOpen positions: 1, worth $36,861.\nIt may hold up
      to $17,646 in positions (2 times account value), so $0 more.\n\n# Other open
      positions\nNone.\n\n# The position: ASSET_01 (crypto)\nLong, $38,000, opened
      2 bars ago at an entry price of $99.76.\nStop price: $95.22, fixed. Code sells
      there. It is 1.6% below the last price.\nNow: the position is worth $36,861.
      Closing it now would leave -$1,232 (-3.2%) after trading costs. At best it was
      -$94, at worst -$1,232.\nSituation when it was opened: Crypto, European hours
      (bar 37 of 96). Patterns in the last 4 bars: none. Latest hourly bar: none.
      Latest daily bar: none. Last 8 bars: five up, three down; this bar is a small
      down bar closing mid-range. Short-term trend up (0.8 typical moves above the
      20-bar average). Long-term trend up (0.1 above the 20-day average). Volume average
      (1.0 times normal). Price is 1.4 above the day''s average price, 0.4 below the
      day''s high, 3.3 above the day''s low, and 0.7 above the previous day''s high.
      Typical move: 0.1% of price.\nSince then: bars 0 to 1 hold.\n\n# The asset now:
      ASSET_01 (crypto)\nLast price: $96.77. Typical move in one bar: $0.29.\nCrypto,
      European hours (bar 40 of 96). Patterns in the last 4 bars: none. Latest hourly
      bar: none. Latest daily bar: none. Last 8 bars: four up, four down; this bar
      is a large down bar closing at its low. Short-term trend down (9.4 typical moves
      below the 20-bar average). Long-term trend down (3.8 below the 20-day average).
      Volume average (1.0 times normal). Price is 9.5 below the day''s average price,
      10.3 below the day''s high, 0.1 above the day''s low, and 9.9 below the previous
      day''s high. Typical move: 0.3% of price.","model":"jev-latest","questions":{"position_screen":{"type":"noul","instructions":"Does
      the position in ASSET_01 call for action now? Only a hard move against it on
      volume well above normal, the price near its stop price, a strong bar back against
      it after it had gone its way, or a good gain that has stopped moving counts.
      Drifting its way, choppy small bars and average volume do not. Most positions
      at most steps need no action."}}}'
