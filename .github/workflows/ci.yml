# Runs on every pull request, with no secrets and no paid services (spec appendix 10, section 5).
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Style check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests (unit and recorded, network blocked)
        run: python -m pytest tests/unit tests/recorded --block-network
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web app
        run: npm ci --prefix web
      # Regenerates the API's description and the web app's types: any difference from what is
      # committed means the two disagree. The build then fails on code that misuses a type.
      - name: Types check (the web app agrees with the API)
        run: |
          python -m jev_trader.api describe web/openapi.json
          npm run types --prefix web
          git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts
          npm run build --prefix web

  # The image builds (spec appendix 10, section 5, check 3): both images build from the checkout,
  # the Python image starts each piece's command and holds no secret, the web image serves the app.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the two images
        run: |
          python3 infra/images.py build --no-load
          echo "TAG=$(python3 infra/images.py tag)" >> "$GITHUB_ENV"
      # --help proves each command's code loads in the image; serving inside the cluster is the
      # deployment check's.
      - name: The Python image starts each piece's command
        run: |
          image="jev-trader:$TAG"
          for piece in "memory serve" "api serve" "sim resume" "dataset build"; do
            docker run --rm "$image" python -m jev_trader.$piece --help > /dev/null
          done
      - name: The Python image holds no secret
        run: |
          image="jev-trader:$TAG"
          found=$(docker run --rm "$image" find /app /home \( -name '.env*' -not -name .env.example -o -name '*.p8' -o -name '*.pem' -o -name saved-tables -o -name '*.tfstate*' \) -print)
          if [ -n "$found" ]; then echo "found in the image: $found"; exit 1; fi
      - name: The web image serves the web app
        run: |
          # nginx looks the API's name up when it starts; here no API runs, so the name points nowhere.
          docker run --rm --detach --name web --publish 8080:80 --add-host api:127.0.0.1 "jev-trader-web:$TAG"
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/ | grep -q '<div id="root">'; then exit 0; fi
            sleep 1
          done
          docker logs web
          exit 1

  # The deployment check (spec appendix 10, sections 3 and 5): in a throwaway kind cluster, with
  # dummy secrets, the three services report healthy and a job started with
  # JOB_LAUNCHER=kubernetes runs. Skeleton: each step is named and does nothing yet; the slice's
  # CI ticket (#201) fills them in.
  deployment-check:
    runs-on: ubuntu-latest
    env:
      # What the wait-until-healthy step asks, inside the cluster: each service's health route.
      MEMORY_HEALTH: http://memory:8765/health
      API_HEALTH: http://api:8000/health
      WEB_HEALTH: http://web/
    steps:
      - uses: actions/checkout@v7
      - name: Build the two images
        run: echo "not built yet"
      - name: Create a throwaway kind cluster
        run: echo "not built yet"
      - name: Load the images into kind
        run: echo "not built yet"
      - name: Apply Terraform's Kubernetes part with dummy secrets
        run: echo "not built yet"
      - name: Wait until the memory server, API and web app report healthy
        run: echo "not built yet; targets $MEMORY_HEALTH $API_HEALTH $WEB_HEALTH"
      - name: Start a job with JOB_LAUNCHER=kubernetes and see it run
        run: echo "not built yet"
      - name: Print the pods' logs
        if: failure()
        run: echo "not built yet"
