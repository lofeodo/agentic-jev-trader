# Runs on every pull request, with no secrets and no paid services (spec appendix 10, section 5).
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Style check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests (unit and recorded, network blocked)
        run: python -m pytest tests/unit tests/recorded --block-network
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web app
        run: npm ci --prefix web
      # Regenerates the API's description and the web app's types: any difference from what is
      # committed means the two disagree. The build then fails on code that misuses a type.
      - name: Types check (the web app agrees with the API)
        run: |
          python -m jev_trader.api describe web/openapi.json
          npm run types --prefix web
          git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts
          npm run build --prefix web

  # The deployment check (spec appendix 10, sections 3 and 5): in a throwaway kind cluster, with
  # dummy secrets, the three services report healthy and a job started with
  # JOB_LAUNCHER=kubernetes runs. Skeleton: each step is named and does nothing yet; the slice's
  # CI ticket (#201) fills them in.
  deployment-check:
    runs-on: ubuntu-latest
    env:
      # What the wait-until-healthy step asks, inside the cluster: each service's health route.
      MEMORY_HEALTH: http://memory:8765/health # the memory server's /health
      API_HEALTH: http://api:8000/health
      WEB_HEALTH: http://web/
    steps:
      - uses: actions/checkout@v7
      - name: Build the two images
        run: echo "not built yet"
      - name: Create a throwaway kind cluster
        run: echo "not built yet"
      - name: Load the images into kind
        run: echo "not built yet"
      - name: Apply Terraform's Kubernetes part with dummy secrets
        run: echo "not built yet"
      - name: Wait until the memory server, API and web app report healthy
        run: echo "not built yet; targets $MEMORY_HEALTH $API_HEALTH $WEB_HEALTH"
      - name: Start a job with JOB_LAUNCHER=kubernetes and see it run
        run: echo "not built yet"
      - name: Print the pods' logs
        if: failure()
        run: echo "not built yet"
