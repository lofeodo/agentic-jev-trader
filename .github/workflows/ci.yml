# Runs on every pull request, with no secrets and no paid services (spec appendix 10, section 5).
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Style check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests (unit and recorded, network blocked)
        run: python -m pytest tests/unit tests/recorded --block-network
