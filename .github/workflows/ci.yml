name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - foundation
      - platform
      - dataset-builder
      - market-data
      - broker-sim
      - memory
      - jev-decision
      - agent
      - evaluation
      - web-app
      - integration

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Tests (paid tests are skipped)
        run: python -m pytest
