# Runs on every pull request, with no secrets and no paid services (spec appendix 10, section 5).
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Style check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests (unit and recorded, network blocked)
        run: python -m pytest tests/unit tests/recorded --block-network
      # The database tests (spec appendix 11, section 1) run against a throwaway local Postgres
      # with pgvector, started by the same command as on the developer's computer: never RDS.
      - name: Start the local Postgres
        run: docker compose -f infra/local-postgres/compose.yaml up --detach --wait
      # Every table made from nothing by Alembic, as the setup login with its local password.
      - name: Tables from nothing (Alembic)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5433"
          POSTGRES_SSL_MODE: disable
          POSTGRES_SETUP_PASSWORD: local-setup
        run: python -m alembic -x database=TRADING_AGENT_TEST upgrade head
      # The tests take the local Postgres's settings from tests/postgres/helpers.py. Until the
      # slice's closing ticket switches them on, they are dormant and skipped here.
      - name: Database tests (local Postgres)
        run: python -m pytest tests/postgres
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web app
        run: npm ci --prefix web
      # Regenerates the API's description and the web app's types: any difference from what is
      # committed means the two disagree. The build then fails on code that misuses a type.
      - name: Types check (the web app agrees with the API)
        run: |
          python -m jev_trader.api describe web/openapi.json
          npm run types --prefix web
          git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts
          npm run build --prefix web

  # The image builds (spec appendix 10, section 5, check 3): both images build from the checkout,
  # the Python image starts each piece's command and holds no secret, the web image serves the app.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the two images
        run: |
          python3 infra/images.py build --no-load
          echo "TAG=$(python3 infra/images.py tag)" >> "$GITHUB_ENV"
      # --help proves each command's code loads in the image; serving inside the cluster is the
      # deployment check's.
      - name: The Python image starts each piece's command
        run: |
          image="jev-trader:$TAG"
          for piece in "memory serve" "api serve" "sim resume" "dataset build"; do
            docker run --rm "$image" python -m jev_trader.$piece --help > /dev/null
          done
      - name: The Python image holds no secret
        run: |
          image="jev-trader:$TAG"
          found=$(docker run --rm "$image" find /app /home \( -name '.env*' -not -name .env.example -o -name '*.p8' -o -name '*.pem' -o -name saved-tables -o -name '*.tfstate*' \) -print)
          if [ -n "$found" ]; then echo "found in the image: $found"; exit 1; fi
      - name: The web image serves the web app
        run: |
          # nginx looks the API's name up when it starts; here no API runs, so the name points nowhere.
          docker run --rm --detach --name web --publish 8080:80 --add-host api:127.0.0.1 "jev-trader-web:$TAG"
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/ | grep -q '<div id="root">'; then exit 0; fi
            sleep 1
          done
          docker logs web
          exit 1

  # The deployment check (spec appendix 10, sections 3 and 5): in a throwaway kind cluster, with
  # dummy secrets, the three services report healthy and a job started with
  # JOB_LAUNCHER=kubernetes runs. It proves the pieces start, not that they reach Snowflake: the
  # dummy key is not even a key, so every login fails before any network call.
  deployment-check:
    runs-on: ubuntu-latest
    # A stuck step (an apply, a wait, a Job) ends the check rather than hanging.
    timeout-minutes: 25
    env:
      # What the wait-until-healthy step asks, inside the cluster: each service's health route.
      MEMORY_HEALTH: http://memory:8765/health
      API_HEALTH: http://api:8000/health
      WEB_HEALTH: http://web/
      CLUSTER: jev-trader
      NAMESPACE: jev-trader
      DATABASE: TRADING_AGENT_TEST
      # A sim number that never existed: its Job has nothing to find, and fails at the login.
      NO_SUCH_SIM: "999999"
    steps:
      - uses: actions/checkout@v7
      - name: Build the two images
        run: |
          python3 infra/images.py build --no-load
          echo "TAG=$(python3 infra/images.py tag)" >> "$GITHUB_ENV"
      - name: Create a throwaway kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER }}
          config: infra/kind-cluster.yaml
      - name: Load the images into kind
        run: |
          kind load docker-image "jev-trader:$TAG" --name "$CLUSTER"
          kind load docker-image "jev-trader-web:$TAG" --name "$CLUSTER"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      # Plain placeholders: no real key exists anywhere in CI. The key files are not keys at all.
      - name: Apply Terraform's Kubernetes part with dummy secrets
        working-directory: infra/terraform/kubernetes
        env:
          TF_VAR_snowflake_account: dummy-account
          TF_VAR_snowflake_private_key_passphrase: dummy-passphrase
          TF_VAR_twelve_data_api_key: dummy-twelve-data-key
          TF_VAR_typesafe_api_key: dummy-typesafe-key
          TF_VAR_anthropic_api_key: dummy-anthropic-key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          for login in api memory sim builder; do echo "dummy-key-$login" > "$RUNNER_TEMP/keys/$login.p8"; done
          terraform init -input=false -backend-config="path=$RUNNER_TEMP/k8s.tfstate"
          terraform apply -input=false -auto-approve -var "image_tag=$TAG" \
            -var "snowflake_keys_dir=$RUNNER_TEMP/keys" -var "database=$DATABASE"
      # Asked from a pod inside the cluster, where the services' names are known. The Python
      # image has no infra/ folder, so the script comes in on standard input.
      - name: Wait until the memory server, API and web app report healthy
        run: |
          kubectl run wait-healthy -n "$NAMESPACE" --rm -i --restart=Never \
            --image="jev-trader:$TAG" --image-pull-policy=Never \
            -- python - "$MEMORY_HEALTH" "$API_HEALTH" "$WEB_HEALTH" --timeout 180 \
            < infra/wait_healthy.py
      # The API's own launcher starts a sim's Job, with the API's own permissions. The sim never
      # existed and the key is a dummy, so the Job's program fails at its login, before any
      # network call: the sign it started and ran is that message in its output. The message is
      # the `cryptography` library's, raised as `connect` reads the key file; reworded in an
      # upgrade, it is what to change here. The launcher answers `job <name>` (JOB_MARK in
      # src/jev_trader/jobs.py).
      - name: Start a job with JOB_LAUNCHER=kubernetes and see it run
        run: |
          mark=$(kubectl exec -n "$NAMESPACE" deploy/api -- env DATABASE="$DATABASE" NO_SUCH_SIM="$NO_SUCH_SIM" python -c \
            'import os, pathlib; from jev_trader.jobs import launcher_named; print(launcher_named(os.environ["JOB_LAUNCHER"], pathlib.Path("logs"), os.environ["DATABASE"]).start(int(os.environ["NO_SUCH_SIM"])))')
          job=${mark#job }
          echo "started: $job"
          kubectl wait -n "$NAMESPACE" "job/$job" --for=condition=Failed --timeout=180s
          kubectl logs -n "$NAMESPACE" "job/$job" | tee job.log
          grep -q "Unable to load PEM file" job.log
      - name: Print the pods' logs
        if: failure()
        run: |
          kubectl get pods,jobs -n "$NAMESPACE" -o wide || true
          kubectl describe pods -n "$NAMESPACE" || true
          for app in memory api web; do kubectl logs -n "$NAMESPACE" "deploy/$app" --all-containers || true; done
          kubectl logs -n "$NAMESPACE" -l app=sim-job --all-containers --prefix || true
