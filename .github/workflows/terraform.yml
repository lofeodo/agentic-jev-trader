name: Terraform

# Checks every Terraform part on every pull request: format and validate, with no secrets and
# no connection to Snowflake or a cluster. infra/terraform is the Snowflake part,
# infra/terraform/kubernetes the kind cluster part, infra/terraform/rds and its postgres/ the RDS
# database and what is inside it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [infra/terraform, infra/terraform/kubernetes, infra/terraform/rds, infra/terraform/rds/postgres]
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
